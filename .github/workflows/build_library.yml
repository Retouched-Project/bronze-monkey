name: Build Library

on:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ios:
    name: Build iOS (Static Lib)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Static Lib
        run: cargo rustc --release --target aarch64-apple-ios --lib -- --crate-type staticlib
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-lib
          path: target/aarch64-apple-ios/release/libbronze_monkey.a

  build-ios-sim:
    name: Build iOS Simulator (Static Lib)
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-ios-sim, x86_64-apple-ios]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Static Lib
        run: cargo rustc --release --target ${{ matrix.target }} --lib -- --crate-type staticlib
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-lib-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/libbronze_monkey.a

  build-android:
    name: Build Android (JNI Libs)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Cargo NDK
        run: cargo install cargo-ndk

      - name: Build Library
        run: cargo ndk -t ${{ matrix.target }} -o ./jniLibs build --release
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-libs-${{ matrix.target }}
          path: jniLibs/

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: libbronze_monkey.so
            asset_name: libbronze_monkey-linux.so
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: libbronze_monkey.dylib
            asset_name: libbronze_monkey-macos.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: bronze_monkey.dll
            asset_name: bronze_monkey-windows.dll
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Library
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p release_assets
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} release_assets/${{ matrix.asset_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-lib-${{ matrix.os }}
          path: release_assets/

  build-wheels:
    name: Build Wheels (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: ubuntu-latest
            target_args: ''
          - os: windows-latest
            name: windows-latest
            target_args: ''
          - os: macos-latest
            name: macos-arm64
            target_args: '--target aarch64-apple-darwin'
          - os: macos-latest
            name: macos-intel
            target_args: '--target x86_64-apple-darwin'
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist ${{ matrix.target_args }}
          sccache: 'true'
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist
