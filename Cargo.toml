[package]
name = "bronze-monkey"
authors = ["ddavef"]
version = "2.0.0"
edition = "2024"
license = "MIT"
readme = "README.md"
description = "A Sans I/O library that implements the Brass Monkey protocol specification."

[lib]
name = "bronze_monkey"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
pyo3 = ["dep:pyo3", "dep:pythonize"]
cbindgen = ["dep:cbindgen"]

[dependencies]
log = "0.4.28"
byteorder = "1.5.0"
pyo3 = { version = "0.28.0", optional = true, features = ["extension-module", "abi3-py38"] }
pythonize = { version = "0.28.0", optional = true }
quick-xml = { version = "0.37.2", features = ["serialize"] }
base64 = "0.22.1"
prost = "0.14.3"
serde = { version = "1.0.228", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.92"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = ["Performance", "Window", "console"] }
console_error_panic_hook = "0.1.7"

[build-dependencies]
prost-build = "0.14.3"
protox = "0.9.1"
cbindgen = { version = "0.29.0", optional = true }

[profile.release]
# lto = true
# opt-level = "s"
